<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-linear-to-r from-0% to-100% from-amber-50 via-orange-50 to-amber-100">
    <span class="block text-sm font-pacifico text-orange-500 m-2 pl-8 font-bold">Special Order</span>
    <section>
        <div class="flex items-center justify-around p-2 md:p-8">
                <div class="w-1/2">
                    <h2 class="text-left text-2xl md:text-7xl font-extrabold font-[poppins] capitalize">
                        create your<br>perfect <span class="text-orange-500">combo</span>
                    </h2>
                    <p class="text-xs mt-2 md:text-lg text-gray-500">
                        Combine your perfect combo with our delicious options, to create your perfect box.
                    </p>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-bowl-food text-2xl text-orange-500"></i>
                            <span class="text-[12px] text-gray-500">Perfect for any occasion!</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-regular fa-star font-2xl text-orange-500"></i>
                            <span class="text-[12px] text-gray-500">Highly Rated!</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-truck-fast font-2xl text-orange-500"></i>
                            <span class="text-[12px] text-gray-500">Fast and Fresh Delivery!</span>
                        </div>
                    </div>
                </div>
                <img src="images/dough.png" alt="" class="w-42 h-42 md:w-84 md:h-84 object-cover">
        </div>
    </section>
</body>
<script src="scripts/combo.js"></script>
</html>
